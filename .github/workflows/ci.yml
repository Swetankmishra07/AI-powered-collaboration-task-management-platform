name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_NAME: Smart Task Management API CI
      VERSION: 1.0.0
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///ci_test.sqlite3
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      REDIS_URL: ""
      AI_ENABLED: "false"
      AI_API_KEY: ""
      AI_API_URL: ""
      AI_MODEL: ""
      ATTACHMENT_STORAGE_PROVIDER: local
      ATTACHMENT_STORAGE_ROOT: ./ci-storage/attachments
      CORS_ALLOWED_ORIGINS: ""
      POSTGRES_DB: task_db_ci
      POSTGRES_USER: task_user_ci
      POSTGRES_PASSWORD: ci-only-postgres-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate migrations with SQLite
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          rm -f ci_test.sqlite3

      - name: Run pytest
        run: python -m pytest -q tests

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --file Dockerfile --tag smart-task-management-api:ci .
